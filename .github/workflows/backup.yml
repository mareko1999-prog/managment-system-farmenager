name: Weekly Database Backup

on:
  schedule:
    # Co niedzielę o 03:00 UTC (05:00 czasu polskiego latem)
    - cron: '0 3 * * 0'
  # Umożliwia ręczne uruchomienie z panelu GitHub → Actions
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalacja zależności
        run: pip install "libsql>=0.1.8" resend

      - name: Uruchomienie backupu
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RECIPIENT_EMAIL: marek.o.1999@gmail.com
        run: python backup_db.py
