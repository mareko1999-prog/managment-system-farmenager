name: Wake Streamlit App (Browser)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wake-streamlit-app
  cancel-in-progress: true

jobs:
  wake-up:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Visit app and keep Streamlit backend active
        env:
          APP_URL: https://farmenager.streamlit.app/
        run: |
          python - <<'PY'
          import os
          import time
          from playwright.sync_api import sync_playwright

          app_url = os.environ["APP_URL"]

          for attempt in range(1, 4):
              try:
                  print(f"Attempt {attempt}: opening {app_url}")

                  with sync_playwright() as p:
                      browser = None

                      try:
                          browser = p.chromium.launch(
                              headless=True,
                              args=[
                                  "--no-sandbox",
                                  "--disable-setuid-sandbox",
                                  "--disable-dev-shm-usage",
                              ],
                          )

                          context = browser.new_context(
                              viewport={"width": 1280, "height": 720},
                              user_agent=(
                                  "Mozilla/5.0 (X11; Linux x86_64) "
                                  "AppleWebKit/537.36 Chrome/124 Safari/537.36"
                              ),
                          )
                          page = context.new_page()
                          page.set_default_timeout(60000)

                          websocket_connected = {"value": False}

                          def on_websocket(ws):
                              websocket_connected["value"] = True
                              print(f"WebSocket opened: {ws.url}")

                          page.on("websocket", on_websocket)

                          response = page.goto(
                              app_url,
                              wait_until="domcontentloaded",
                              timeout=60000,
                          )
                          status = response.status if response is not None else None
                          print(f"HTTP status: {status}")

                          deadline = time.monotonic() + 90

                          while time.monotonic() < deadline:
                              if websocket_connected["value"]:
                                  break
                              page.wait_for_timeout(1000)

                          page.wait_for_timeout(30000)

                          body_text = page.locator("body").inner_text(timeout=10000)
                          title = page.title()

                          print(f"Loaded URL: {page.url}")
                          print(f"Title: {title}")
                          print(f"WebSocket connected: {websocket_connected['value']}")

                          sleeping_markers = (
                              "app is sleeping",
                              "please wake",
                              "your app is in sleep mode",
                              "this app has gone to sleep",
                              "sleeping",
                          )

                          lower_body = body_text.lower()
                          is_sleeping = any(
                              marker in lower_body
                              for marker in sleeping_markers
                          )

                          if is_sleeping:
                              raise RuntimeError(
                                  "Streamlit Community Cloud is showing a sleeping state"
                              )

                          if status is not None and status >= 400:
                              raise RuntimeError(
                                  f"Unexpected HTTP status: {status}"
                              )

                          if not websocket_connected["value"]:
                              raise RuntimeError(
                                  "Streamlit WebSocket never connected"
                              )

                          print(
                              "Wake-up succeeded: "
                              "Streamlit backend connection established."
                          )

                      finally:
                          if browser is not None:
                              browser.close()

                  break

              except Exception as exc:
                  print(f"Attempt {attempt} failed: {exc}")

                  if attempt == 3:
                      raise

                  time.sleep(15)
          PY
