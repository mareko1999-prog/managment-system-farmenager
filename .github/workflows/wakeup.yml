name: Wake Streamlit App (Browser)

on:
  schedule:
    - cron: "0 */10 * * *"
  workflow_dispatch:

jobs:
  wake-up:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Visit app with headless browser
        env:
          APP_URL: https://farmenager.streamlit.app/
        run: |
          python - <<'PY'
          import os
          import time
          from playwright.sync_api import sync_playwright

          app_url = os.environ["APP_URL"]

          for attempt in range(1, 4):
              try:
                  print(f"Attempt {attempt}: opening {app_url}")
                  with sync_playwright() as p:
                      browser = p.chromium.launch(
                          headless=True,
                          args=[
                              "--no-sandbox",
                              "--disable-setuid-sandbox",
                              "--disable-dev-shm-usage",
                          ],
                      )

                      page = browser.new_page()
                      page.set_default_timeout(60000)

                      response = page.goto(app_url, wait_until="domcontentloaded", timeout=60000)
                      if response is not None:
                          print(f"HTTP status: {response.status}")

                      # Streamlit wznawia połączenie WebSocket niemal natychmiast po załadowaniu strony,
                      # więc czekamy krótko, ale nie zakładamy, że to wystarczy bez walidacji.
                      time.sleep(10)

                      print(f"Loaded URL: {page.url}")
                      print(f"Title: {page.title()}")
                      browser.close()

                  print("Wake-up succeeded.")
                  break
              except Exception as exc:
                  print(f"Attempt {attempt} failed: {exc}")
                  if attempt == 3:
                      raise
                  time.sleep(15)
          PY
